name: Local MERN CI/CD

on:
  push:
    branches:
      - dev-test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build the application
        run: npm run build

      - name: Deploy to local Ubuntu server
        run: |
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem

          # Replace `ubuntu@your.local.ip` with your local machine's reachable IP
          rsync -avz -e "ssh -i key.pem -o StrictHostKeyChecking=no" ./src/ ubuntu@your.local.ip:/home/ubuntu/mern/src
          rsync -avz -e "ssh -i key.pem -o StrictHostKeyChecking=no" ./app.js ubuntu@your.local.ip:/home/ubuntu/mern/app.js
          rsync -avz -e "ssh -i key.pem -o StrictHostKeyChecking=no" ./package.json ubuntu@your.local.ip:/home/ubuntu/mern/package.json
          rsync -avz -e "ssh -i key.pem -o StrictHostKeyChecking=no" ./package-lock.json ubuntu@your.local.ip:/home/ubuntu/mern/package-lock.json

          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@your.local.ip "
            cd /home/ubuntu/mern &&
            npm install &&
            pm2 restart all || pm2 start app.js --name mern-api
          "
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
